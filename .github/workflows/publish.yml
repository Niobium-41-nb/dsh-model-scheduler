# Publish dsh-model-scheduler to npm through a trusted publisher (OIDC) — no token.
#
# Why this file exists: the first publish (2026-09-13, 0.1.0) worked only because a
# human sat in a terminal and cleared a browser 2FA challenge for each package. A
# non-TTY shell cannot pass that challenge, and swapping credentials does not help
# — a `bypass_2fa` granular token and a fresh `npm login --auth-type=web`
# credential both authenticate for reads and both get EOTP at publish time.
# A trusted publisher is the supported way out.
#
# Read the workspace checklist before the first run: ../../TRUSTED-PUBLISHING.md.
# It has the exact npm settings-page values, and the two ways this workflow fails
# silently (the workflow filename must match byte-for-byte, and the trusted
# publisher must be allowed to run `npm publish` — configurations created after
# 2026-09-03 default to `npm stage publish` only).
name: publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required: this is what lets npm verify the workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # Node 24 on purpose: trusted publishing needs the npm CLI at 11.5.1+ and
      # Node 22 still ships npm 10.x.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in a release build

      - name: Install
        run: pnpm install --frozen-lockfile

      # No build step here on purpose: unlike the other plugins, this repository
      # commits `lib/` (including the hand-written lib/client.js bundle), so the
      # tagged tree is already exactly what should be published. Regenerating it
      # in CI would publish something the tag does not contain.

      # The npm name is free, so no manifest patching is needed — this one really
      # is published as `dsh-model-scheduler`.
      - name: Resolve the version to publish
        id: target
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already published
        if: steps.target.outputs.already == 'true'
        run: echo "${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }} is already on the registry."

      - name: Publish
        if: steps.target.outputs.already == 'false'
        run: npm publish
